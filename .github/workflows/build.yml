name: Gerar executavel

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pillow pyinstaller

      - name: Gerar .exe
        run: pyinstaller --onefile --windowed --name PetshopCadastro petshop.py

      - name: Publicar na pagina de Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PetshopCadastro.exe
